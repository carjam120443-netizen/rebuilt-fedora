name: Build Rebuilt Fedora ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: fedora:44

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Fedora ISO build tools
        run: |
          dnf -y update
          dnf -y install \
            lorax \
            lorax-lmc-novirt \
            xorriso \
            squashfs-tools \
            dnf5

      - name: Prepare build directories
        run: |
          rm -rf "$GITHUB_WORKSPACE/output"
          mkdir -p "$GITHUB_WORKSPACE/output"

      - name: Build Rebuilt Fedora ISO
        run: |
          livemedia-creator \
            --make-iso \
            --no-virt \
            --project='Rebuilt Fedora' \
            --releasever=44 \
            --resultdir="$GITHUB_WORKSPACE/output" \
            --volid='REBUILT_FEDORA' \
            --iso="$GITHUB_WORKSPACE/rebuilt-fedora.iso"

      - name: Verify ISO
        run: |
          test -f "$GITHUB_WORKSPACE/rebuilt-fedora.iso"
          ls -lh "$GITHUB_WORKSPACE/rebuilt-fedora.iso"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-fedora-iso
          path: rebuilt-fedora.iso
          if-no-files-found: error
