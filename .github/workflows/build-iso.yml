name: Build Rebuilt Fedora ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: fedora:44

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Fedora ISO build tools
        run: |
          dnf -y update
          dnf -y install \
            lorax \
            lorax-lmc-novirt \
            anaconda \
            anaconda-dracut \
            xorriso \
            squashfs-tools \
            curl

      - name: Download Fedora 44 Anaconda boot media
        run: |
          curl -fL \
            -o "$GITHUB_WORKSPACE/fedora-boot.iso" \
            https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Server/x86_64/os/images/boot.iso
          test -s "$GITHUB_WORKSPACE/fedora-boot.iso"
          ls -lh "$GITHUB_WORKSPACE/fedora-boot.iso"

      - name: Prepare build directories
        run: |
          rm -rf "$RUNNER_TEMP/rebuilt-fedora-lmc"

      - name: Build Rebuilt Fedora ISO
        run: |
          livemedia-creator \
            --make-iso \
            --no-virt \
            --ks="$GITHUB_WORKSPACE/build/rebuilt-fedora.ks" \
            --iso="$GITHUB_WORKSPACE/fedora-boot.iso" \
            --project='Rebuilt Fedora' \
            --releasever=44 \
            --resultdir="$RUNNER_TEMP/rebuilt-fedora-lmc" \
            --volid='REBUILT_FEDORA' \
            --iso-only \
            --iso-name='rebuilt-fedora.iso'

      - name: Find and prepare ISO
        run: |
          ISO=$(find "$RUNNER_TEMP/rebuilt-fedora-lmc" -type f -name '*.iso' | head -n 1)
          test -n "$ISO"
          cp "$ISO" "$GITHUB_WORKSPACE/rebuilt-fedora.iso"
          ls -lh "$GITHUB_WORKSPACE/rebuilt-fedora.iso"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-fedora-iso
          path: rebuilt-fedora.iso
          if-no-files-found: error
