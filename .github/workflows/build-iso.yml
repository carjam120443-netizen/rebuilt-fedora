name: Build Rebuilt Fedora ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Rebuilt Fedora ISO in privileged Fedora container
        run: |
          docker pull fedora:44
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP:/runner-temp" \
            -w /workspace \
            fedora:44 \
            bash -euxo pipefail -c '
              dnf -y update
              dnf -y install \
                lorax \
                lorax-lmc-novirt \
                anaconda \
                anaconda-dracut \
                xorriso \
                squashfs-tools \
                curl

              curl -fL \
                -o /workspace/fedora-boot.iso \
                https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Server/x86_64/os/images/boot.iso

              test -s /workspace/fedora-boot.iso

              rm -rf /runner-temp/rebuilt-fedora-lmc

              livemedia-creator \
                --make-iso \
                --no-virt \
                --ks=/workspace/build/rebuilt-fedora.ks \
                --iso=/workspace/fedora-boot.iso \
                --project="Rebuilt Fedora" \
                --releasever=44 \
                --resultdir=/runner-temp/rebuilt-fedora-lmc \
                --volid=REBUILT_FEDORA \
                --iso-only \
                --iso-name=rebuilt-fedora.iso

              ISO=$(find /runner-temp/rebuilt-fedora-lmc -type f -name "*.iso" | head -n 1)
              test -n "$ISO"
              cp "$ISO" /workspace/rebuilt-fedora.iso
              ls -lh /workspace/rebuilt-fedora.iso
            '

      - name: Verify ISO
        run: |
          test -s rebuilt-fedora.iso
          ls -lh rebuilt-fedora.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-fedora-iso
          path: rebuilt-fedora.iso
          if-no-files-found: error
